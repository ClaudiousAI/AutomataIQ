[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI uses function calls in argument defaults
    "UP042", # explicit str+Enum keeps Pydantic v2 model_validate working
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["\\.venv", "build", "dist"]
files = ["app"]
# FastAPI's route decorators (``@app.get``, ``@router.post`` …) and
# pytest's ``@fixture`` carry no upstream type annotations, so strict
# mode surfaces 10 ``untyped-decorator`` warnings across
# ``app/main.py``, ``app/auth/api.py`` and
# ``app/auth/tests/test_middleware.py`` regardless of who owns the
# decorated function. The M02 closure loop (docs/18) recorded these
# as CI-gate gotchas. M03a is the first PR to trip them in CI
# because it adds the strict mypy gate to a branch that already
# contains the M02 routes; rather than rewrite every decorator, we
# silence the diagnostic globally — matching the FastAPI ecosystem
# convention.
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
# Tests are validated for coverage and behaviour, not for strict
# type-decoration. They are the seam where we exercise the API; a
# missing ``-> None`` should not block CI on a contract that we
# document in the typechecker config.
module = ["app.*.tests.*", "notifications.tests.*", "tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
# Tests are also the seam that imports optional third-party test
# substrates (``pgserver`` is untyped and varies in ``__all__``
# between wheels); a ``# type: ignore`` that masks a real error on
# one developer's machine may report ``unused-ignore`` on another's.
# Both signals are intentional and we silence ``unused-ignore``
# rather than strip the comments.
disable_error_code = ["unused-ignore"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
# Without ``pythonpath = ["."]`` the test files under ``app/<m>/tests/``
# (M02+) import ``app.auth.X`` as absolute paths — pytest's default
# import-mode adds each test's parent directory to ``sys.path``, which
# exposes ``app/auth/tests/`` but not ``app/`` itself. Pinning ``.``
# (the rootdir, ``backend/``) puts ``app`` and ``notifications`` on
# ``sys.path`` for the duration of the run, both locally and on CI.
pythonpath = ["."]
# Discovery is rooted at every package that ships tests. Per-module
# ``app/<m>/tests/`` subpackages (M02+) are picked up automatically
# via the ``app`` rootdir so the CI workflow never needs to be edited
# again when a new module lands. Pinned in docs/23 §3.5.
testpaths = [
    "tests",
    "notifications/tests",
    "app",
]
