# Alembic config for the SAIE backend.
#
# The runtime (env.py) reads connection settings from app.settings, NOT
# from this file — so the only thing this file does is pin Alembic's
# script_location and a couple of logging knobs. Migration URLs are
# resolved at runtime because ``migrator_database_url`` carries the
# ``saie_migrator`` role + BYPASSRLS, and pinning it here would be a
# security boundary violation if anyone ever diff-ed this file into a
# public repo.

[alembic]
script_location = alembic

# Revision file naming: ``NNNN_<slug>.py`` (Alembic default).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for ``create_date`` in revision files.
timezone = UTC

# Maximum length of the slug.
truncate_slug_length = 40

# Allow .pyc files to be ignored.
sourceless = false

# Version path separator.
version_path_separator = os

# Don't fail on a missing tag directory; tags are optional.
tag_empty = true

[post_write_hooks]
# Empty by default; the project uses pre-commit (when present) rather
# than Alembic's built-in hooks.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
