# Nginx config for the SAIE SPA container.
#
# Two responsibilities:
#   1. Serve the static React build from /usr/share/nginx/html.
#   2. Reverse-proxy /api/* to the upstream FastAPI service.
#
# Traceability: NFR-005 (the same-origin /api/health is used by the
# App.jsx status pill).

server {
    listen 80 default_server;
    server_name _;

    # Static SPA assets. history fallback for the client-side router
    # that lands in M13.
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for fingerprinted bundles emitted by `vite build`.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy API calls to the backend container.
    # The /api prefix is stripped so the FastAPI app sees /health, /ready, etc.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA history fallback — anything not matching a file routes to index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
