# SAIE — edge Nginx reverse proxy (M01).
#
# The SPA container ships its own nginx (see web/nginx.conf) that
# already serves the SPA and proxies /api/* to the FastAPI service.
# This edge proxy is reserved for the production deployment shape
# (M16): TLS termination, host-based routing, and an additional
# defense layer in front of the API.
#
# M01 only verifies that this config file exists and is well-formed;
# it is NOT loaded by ``docker compose up`` in dev. M16 wires the
# edge service into the production compose overlay.
#
# Traceability: NFR-004 (TLS termination sits here), NFR-005
# (edge healthcheck), NFR-009 (production deployment shape).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    upstream saie_web {
        server web:80;
    }

    upstream saie_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # Edge healthcheck — the deployment probe hits this.
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Reverse-proxy all API traffic.
        location /api/ {
            proxy_pass http://saie_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else goes to the SPA. The SPA's own nginx will
        # handle asset routing and the history fallback.
        location / {
            proxy_pass http://saie_web;
            proxy_set_header Host $host;
        }
    }
}
